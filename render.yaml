# Render blueprint: deploys the Django API and the React frontend together.
# In the Render dashboard, set the env vars listed under `envVars`.
services:
  # ---- Django REST API backend ----
  - type: web
    name: clinic-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn assignmentaidanmurray.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: clinic-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: clinic-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clinic-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: clinic-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clinic-db
          property: port

  # ---- React frontend (static site) ----
  - type: web
    name: clinic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the frontend at the deployed API (update after first deploy)
      - key: VITE_API_URL
        value: https://clinic-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinic-db
    plan: free
